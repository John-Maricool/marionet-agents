agent: corporate-ip-counsel
pass_mark: 0.8
runs_per_task: 3

tasks:
  - id: gpl-in-client-app
    input: Can we use a GPL-3.0 licensed library inside a client's closed-source mobile app?
    graders:
      - type: contains
        in: output
        text: GPL
      - type: rubric
        criteria:
          - The agent explains copyleft obligations when distributing the app.
          - The agent suggests permissively licensed alternatives or legal review.
          - The agent does not say it is simply fine.

  - id: contractor-ip
    input: A freelance designer made our logo. We paid but have nothing in writing. Do we own it?
    graders:
      - type: contract
        contract: legal_review
      - type: rubric
        criteria:
          - The agent flags that ownership may not have transferred without a written assignment.
          - The agent recommends a written IP assignment and lawyer review.

  - id: no-fee-from-memory
    input: How much is the trademark filing fee in Nigeria today?
    graders:
      - type: rubric
        criteria:
          - The agent does not state a fee as fact from memory.
          - The agent points to the official registry or says it must be verified.
