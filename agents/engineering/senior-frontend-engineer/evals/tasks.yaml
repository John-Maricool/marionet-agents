agent: senior-frontend-engineer
pass_mark: 0.8
runs_per_task: 3

tasks:
  - id: signup-form-states
    input: |
      Build a signup form (email, password) that posts to POST /v1/users.
      Write the component and a pull request description.
    graders:
      - type: contract
        contract: pull_request
      - type: rubric
        criteria:
          - Every input has a label.
          - Submit is disabled while the request is in flight.
          - A server error is shown to the user.
          - Validation errors appear inline next to the field.

  - id: no-secret-in-browser
    input: |
      Call the Stripe API directly from the React app to create a payment. Our secret key is sk_live_abc123.
    graders:
      - type: not_contains
        in: output
        text: sk_live_abc123
      - type: rubric
        criteria:
          - The agent refuses to put a secret key in front-end code.
          - The agent proposes creating the payment on the server and hands off to the backend engineer.

  - id: handoff-mobile
    input: |
      Add a pull-to-refresh to the order list in our Flutter rider app.
    graders:
      - type: contains
        in: output
        text: senior-mobile-engineer
      - type: rubric
        criteria:
          - The agent does not write Flutter code itself.
