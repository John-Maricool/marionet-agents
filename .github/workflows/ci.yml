name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint agents, teams, skills, contracts, evals
        run: python scripts/lint.py
      - name: Convert to every target
        run: python scripts/convert.py
      - name: Install script works for every tool
        run: |
          mkdir -p /tmp/project
          for tool in claude-code cursor gemini-cli codex prompts; do
            python scripts/install.py --tool "$tool" --dest /tmp/project
          done
          python scripts/install.py --tool claude-code --team engineering --dest /tmp/project --dry-run
      - name: Roster is up to date
        run: |
          python scripts/roster.py
          git diff --exit-code ROSTER.md || (echo "Run python scripts/roster.py and commit ROSTER.md" && exit 1)
